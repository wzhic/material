name: Governance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance (${{ matrix.os }})
    if: github.repository == 'wzhic/material'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_unit: backend
          - os: macos-latest
            release_unit: mac
          - os: windows-latest
            release_unit: win
    env:
      MATERIAL_RELEASE_UNIT: ${{ matrix.release_unit }}
      PSModuleAnalysisCachePath: ${{ github.workspace }}/../PowerShell-ModuleAnalysisCache
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Require non-empty governance test suites
        run: >-
          python -c "import unittest; counts = {'governance': unittest.TestLoader().discover('tools/governance/tests', pattern='test_*.py').countTestCases(), 'hooks': unittest.TestLoader().discover('.codex/tests', pattern='test_*.py').countTestCases()}; missing = [name for name, count in counts.items() if count == 0]; print('Discovered test counts:', counts); raise SystemExit('No tests discovered: ' + ', '.join(missing) if missing else 0)"

      - name: Run current task checks through controlled runner
        run: >-
          python -c "import json, pathlib, subprocess, sys; task_id = json.loads(pathlib.Path('project-control/current-task.json').read_text(encoding='utf-8'))['task_id']; controlled_code = subprocess.call([sys.executable, 'tools/governance/taskctl.py', 'run-required', task_id, '--phase', 'ci', '--release-unit', '${{ matrix.release_unit }}', '--environment', 'github-actions:${{ github.event_name }}:${{ matrix.release_unit }}', '--json']); diagnostics = [[sys.executable, '-m', 'unittest', 'discover', '-s', 'tools/governance/tests', '-p', 'test_*.py', '-v'], [sys.executable, 'tools/governance/reconcile.py', 'static', '--json']]; controlled_code == 0 or [subprocess.call(command) for command in diagnostics]; raise SystemExit(controlled_code)"
