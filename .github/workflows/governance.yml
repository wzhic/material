name: Governance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance (${{ matrix.os }})
    if: github.repository == 'wzhic/material'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_unit: backend
          - os: macos-latest
            release_unit: mac
          - os: windows-latest
            release_unit: win
    env:
      MATERIAL_RELEASE_UNIT: ${{ matrix.release_unit }}
      PSModuleAnalysisCachePath: ${{ github.workspace }}/../PowerShell-ModuleAnalysisCache
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Set up Node.js for desktop checks
        if: matrix.release_unit != 'backend'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install locked desktop dependencies
        if: matrix.release_unit != 'backend'
        run: npm ci --prefix apps/desktop

      - name: Require non-empty governance test suites
        run: >-
          python -c "import unittest; counts = {'governance': unittest.TestLoader().discover('tools/governance/tests', pattern='test_*.py').countTestCases(), 'hooks': unittest.TestLoader().discover('.codex/tests', pattern='test_*.py').countTestCases()}; missing = [name for name, count in counts.items() if count == 0]; print('Discovered test counts:', counts); raise SystemExit('No tests discovered: ' + ', '.join(missing) if missing else 0)"

      - name: Run current task checks through controlled runner
        run: >-
          python -c "import json, pathlib, subprocess, sys; current = json.loads(pathlib.Path('project-control/current-task.json').read_text(encoding='utf-8')); task_id = current['task_id']; task = json.loads(pathlib.Path('project-control/tasks', task_id + '.json').read_text(encoding='utf-8')); unit = '${{ matrix.release_unit }}'; fallback = [sys.executable, 'tools/governance/reconcile.py', 'static']; controlled_code = subprocess.call([sys.executable, 'tools/governance/taskctl.py', 'run-required', task_id, '--phase', 'ci', '--release-unit', '${{ matrix.release_unit }}', '--environment', 'github-actions:${{ github.event_name }}:' + unit, '--json'])) if unit in task.get('release_units', []) else subprocess.call(fallback); diagnostics = [[sys.executable, '-m', 'unittest', 'discover', '-s', 'tools/governance/tests', '-p', 'test_*.py', '-v'], fallback]; controlled_code == 0 or [subprocess.call(command) for command in diagnostics]; raise SystemExit(controlled_code)"
